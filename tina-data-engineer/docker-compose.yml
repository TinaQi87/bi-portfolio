services:
  devtools:
    build: .
    container_name: tina-devtools
    restart: unless-stopped
    ports:
      - "8888:8888"
    volumes:
      - /Users/zz/zz/Documents/bi-portfolio:/workspace
      - ~/.aws:/root/.aws:ro
      - ~/.ssh:/root/.ssh:ro
    networks:
      - tina-network
    environment:
      - AWS_PROFILE=${AWS_PROFILE:-default}
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}

  mysql:
    image: mysql:latest
    container_name: tina-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-devdb}
      MYSQL_USER: ${MYSQL_USER:-devuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-devpassword}
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks:
      - tina-network

  postgres:
    image: postgres:17
    container_name: tina-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devdb}
      POSTGRES_USER: ${POSTGRES_USER:-devuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - tina-network

  minio:
    image: minio/minio:latest
    container_name: tina-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    networks:
      - tina-network
    command: server /data --console-address ":9001"

volumes:
  minio-data:

networks:
  tina-network:
    driver: bridge
